services:
  speech-to-text:
    image: speech-to-text:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: speech-to-text
    ports:
      - "4200:80"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - speech-to-text-net

  speech-to-text-dev:
    image: speech-to-text:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: speech-to-text-dev
    ports:
      - "4201:4200"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NG_CLI_ANALYTICS=false
    command: npm run start -- --host 0.0.0.0 --poll 2000
    restart: unless-stopped
    networks:
      - speech-to-text-net

  postgres:
    image: postgres:16-alpine
    container_name: speech-to-text-db
    environment:
      POSTGRES_USER: s2t
      POSTGRES_PASSWORD: s2t_pass
      POSTGRES_DB: speech_to_text
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s2t -d speech_to_text"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - speech-to-text-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: speech-to-text-api
    ports:
      - "1212:1212"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://s2t:s2t_pass@postgres:5432/speech_to_text?sslmode=disable
      JWT_SECRET: dev-secret-change-in-production
      PORT: "1212"
      ALLOWED_ORIGINS: http://localhost:4200,http://localhost:4201
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1212/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - speech-to-text-net

networks:
  speech-to-text-net:
    name: speech-to-text-net
    driver: bridge

volumes:
  pgdata:
